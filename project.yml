# XcodeGen spec. Edit this file, then run `xcodegen generate` to rebuild ClipboardWheel.xcodeproj.
name: ClipboardWheel

options:
  bundleIdPrefix: com.davidgoren
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

packages:
  ClipboardWheelCore:
    path: Packages/ClipboardWheelCore

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  ClipboardWheel:
    type: application
    platform: macOS
    sources:
      - path: ClipboardWheel
    dependencies:
      - package: ClipboardWheelCore
    info:
      path: ClipboardWheel/Info.plist
      properties:
        CFBundleDisplayName: Clipboard Wheel
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 David Goren. MIT License.
    settings:
      base:
        PRODUCT_NAME: Clipboard Wheel
        PRODUCT_BUNDLE_IDENTIFIER: com.davidgoren.ClipboardWheel
        PRODUCT_MODULE_NAME: ClipboardWheel
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES

  ClipboardWheelTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: ClipboardWheelTests
    dependencies:
      - target: ClipboardWheel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.davidgoren.ClipboardWheelTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Clipboard Wheel.app/Contents/MacOS/Clipboard Wheel"
        BUNDLE_LOADER: "$(TEST_HOST)"
        GENERATE_INFOPLIST_FILE: YES

schemes:
  ClipboardWheel:
    build:
      targets:
        ClipboardWheel: all
        ClipboardWheelTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - ClipboardWheelTests
        - package: ClipboardWheelCore/ClipboardWheelCoreTests
    archive:
      config: Release
